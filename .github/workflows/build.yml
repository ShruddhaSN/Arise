name: Build Arise APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Uploaded Arise.zip from a phone? Unpack it over the code before building.
      - name: Unpack Arise.zip if present
        run: |
          if [ -f Arise.zip ]; then
            rm -rf /tmp/src && mkdir -p /tmp/src
            unzip -q -o Arise.zip -d /tmp/src
            if [ -d /tmp/src/Arise ]; then cp -r /tmp/src/Arise/. . ; else cp -r /tmp/src/. . ; fi
            echo "Built from Arise.zip"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Arise.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Arise.apk --title "Arise (latest build)" --notes "Build #${{ github.run_number }}"
